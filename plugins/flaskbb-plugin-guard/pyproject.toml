[project]
name = "flaskbb-plugin-guard"
version = "0.1.0"
description = "FlaskBB-Guard: AI-driven automatic content moderation for FlaskBB."
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.12"
authors = [
  {name = "Nikhil Mudavath"},
]
dependencies = []

[project.entry-points.'flaskbb_plugins']
guard = 'flaskbb_guard'

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flaskbb_guard"]