[project]
name = "flaskbb-plugin-guard"
version = "0.1.0"
description = "FlaskBB-Guard: AI-based toxicity detection for FlaskBB."
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.12"
authors = [
  {name = "Nikhil Mudavath"},
]
dependencies = []

[project.optional-dependencies]
ai = [
  "transformers>=4.40",
  "torch>=2.5",
]

[project.entry-points.'flaskbb_plugins']
guard = 'flaskbb_guard'

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flaskbb_guard"]