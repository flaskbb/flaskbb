ci:
  autoupdate_schedule: monthly
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: c0f278f1254ccc8fb09676bcdb8d847e7db493e5  # frozen: v0.17.4
    hooks:
      - id: ruff-check
        args: [ "--fix" ]
      - id: ruff-check
        args: ["--select", "I", "--fix"]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: debug-statements
      - id: fix-byte-order-marker
      - id: trailing-whitespace
  - repo: https://github.com/djlint/djLint
    rev: 328ae8ca553d7bf0c4123dec95ccb3dfda4f28ff  # frozen: v1.49.9
    hooks:
      - id: djlint-reformat
        files: ^flaskbb/templates/.*\.html$
      - id: djlint
        files: ^flaskbb/templates/.*\.html$
  - repo: https://github.com/biomejs/pre-commit
    rev: bc3c1d9acd69eaa1e5912f282ca563f914fd78d3  # frozen: v2.6.4
    hooks:
      - id: biome-check
        additional_dependencies: ["@biomejs/biome@2.5.15"]
        files: ^flaskbb/themes/.*\.(js|mjs|cjs)$
        exclude: /static/
