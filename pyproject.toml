[project]
name = "FlaskBB"
version = "3.0.0"
dependencies = [
  "alembic>=1.18.5",
  "attrs>=26.1.0",
  "Babel>=2.18.0",
  "blinker>=1.9",
  "celery>=5.6.3",
  "click>=8.4.2",
  "click-log>=0.4.0",
  "click-plugins>=1.1.1.2",
  "click-repl>=0.3.0",
  "email-validator>=2.3.0",
  "Flask>=3.1.3",
  "Flask-Alembic>=3.2.0",
  "Flask-Allows2>=1.2.0",
  "Flask-BabelPlus>=2.4.1",
  "Flask-Caching>=2.4.0",
  "Flask-DebugToolbar>=0.16.0",
  "flask-debugtoolbar-warnings>=0.1.0",
  "Flask-Limiter>=4.1.1",
  "Flask-Login>=0.6.3",
  "Flask-Mail>=0.10.0",
  "flask-redis>=0.4.0",
  "Flask-SQLAlchemy>=3.1.1",
  "Flask-Themes2>=1.0.1",
  "Flask-WTF>=1.3.0",
  "flaskbb-plugin-conversations>=2.0.2",
  "flaskbb-plugin-portal==2.1.0.dev1",
  "Jinja2>=3.1.6",
  "MarkupSafe>=3.0.3",
  "mistune>=3.3.2",
  "Pillow>=12.3.0",
  "pluggy>=1.6.0",
  "Pygments>=2.20.0",
  "PyJWT>=2.12.1",
  "pytz>=2026.2",
  "SQLAlchemy>=2.0.51",
  "SQLAlchemy-Utils>=0.42.1",
  "Unidecode>=1.4.0",
  "Werkzeug>=3.1.8",
  "WTForms>=3.2.2",
  "WTForms-SQLAlchemy>=0.4.2",
  "requests>=2.34.2",
]
requires-python = ">=3.12"
authors = [
  {name = "Peter Justin", email = "peter.justin@outlook.com"},
]
maintainers = [
  {name = "Peter Justin", email = "peter.justin@outlook.com"}
]
description = "A classic Forum Software in Python using Flask."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICEN[CS]E"]
keywords = ["flask", "forum", "social", "community"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Flask",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Python Modules"
]

[project.optional-dependencies]
gunicorn = [
  "gunicorn>=26.0.0",
]

[project.urls]
Homepage = "https://github.com/flaskbb/flaskbb"
Documentation = "https://flaskbb.readthedocs.io/en/latest/"
Repository = "https://github.com/flaskbb/flaskbb"
Issues = "https://github.com/flaskbb/flaskbb"
Changelog = "https://github.com/flaskbb/flaskbb/blob/master/CHANGES"

[project.scripts]
flaskbb = "flaskbb.cli.main:flaskbb"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flaskbb", "wsgi.py", "celery_worker.py"]

[dependency-groups]
dev = [
    "ipython>=9.9.0",
    "ruff",
    "tox>=4.39",
    "tox-uv",
    {include-group = "pre-commit"},
    {include-group = "docs"},
    {include-group = "tests"},
    {include-group = "typing"},
]
pre-commit = [
    "pre-commit",
    "pre-commit-uv",
]
docs = [
    "alabaster",
    "sphinx",
    "sphinx-issues",
    "sphinx-tabs",
    "sphinx-intl>=2.3.1",
    "sphinxcontrib-log-cabinet",
]
tests = [
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "pytest-xdist",
    "pytest-xprocess",
    "cov-core",
    "coverage",
    "freezegun",
    "responses"
]
typing = [
    "mypy",
    "pyright",
    "pytest",
]
gha-update = [
    "gha-update ; python_full_version >= '3.12'",
]


[tool.uv]
package = true
default-groups = ["dev"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.basedpyright]
include = ["flaskbb"]
exclude = ["**/node_modules", "**/resources", "**/__pycache__", "**/docs"]
defineConstant = { DEBUG = true }
reportIgnoreCommentWithoutRule = false
reportMissingImports = "error"
reportMissingTypeStubs = false
reportUnusedCallResult = false
reportUnannotatedClassAttribute = false
reportUnusedParameter = false
reportAny = false
reportExplicitAny = false

[tool.pytest]
minversion = "9.0"
filterwarnings = [
    "ignore::jwt.warnings.InsecureKeyLengthWarning"
]
addopts = [
    "-vvl",
    "--strict-markers",
    "--capture", "fd",
    "--tb", "short",
    "--pythonwarnings", "error::flaskbb.deprecation.FlaskBBDeprecation",
    "--numprocesses", "auto",
    "--dist", "load"
]
testpaths = [
    "tests",
]

[tool.ruff]
src = ["flaskbb"]
fix = true
show-fixes = true
output-format = "full"

[tool.ruff.lint]
ignore = [
    "E711",
    "E712",
    "UP007",  # Use X | Y for type annotations; doesn't work with some of our (stringy) type definitions - should aim to resolve this
]

select = [
    "B",  # flake8-bugbear
    "E",  # pycodestyle error
    "F",  # pyflakes
    "I",  # isort
    "UP",  # pyupgrade
    "W",  # pycodestyle warning
]

[tool.ruff.lint.isort]
order-by-type = false

[tool.coverage.run]
branch = true
source = ["flaskbb", "tests"]
omit = [
    "flaskbb/flaskbb/static/*",
    "flaskbb/flaskbb/templates/*",
    "flaskbb/flaskbb/themes/*",
    "flaskbb/flaskbb/migrations/*"
]

[tool.coverage.paths]
source = ["flaskbb", "*/site-packages"]

[tool.coverage.report]
exclude_also = [
    "if t.TYPE_CHECKING",
    "raise NotImplementedError",
    ": \\.{3}",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error",
    "default::pytest.PytestUnraisableExceptionWarning",
]

[tool.mypy]
python_version = "3.12"
files = ["flaskbb/"]
warn_unused_configs = true

# TODO if all of these can be enabled we can just set 'strict = true'
disallow_subclassing_any = true
# disallow_untyped_calls = true
# disallow_untyped_defs = true
# disallow_incomplete_defs = true
# check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
# warn_return_any = true
# no_implicit_reexport = true
strict_equality = true
strict_concatenate = true


[tool.tox]
env_list = [
    "py3.14",
    "py3.13",
    "py3.12",
    "style",
    "typing",
    "docs",
]

[tool.tox.env_run_base]
description = "pytest on latest dependency versions"
runner = "uv-venv-lock-runner"
package = "wheel"
wheel_build_env = ".pkg"
constrain_package_deps = true
use_frozen_constraints = true
dependency_groups = ["tests"]
env_tmp_dir = "{toxworkdir}/tmp/{envname}"
commands = [[
    "pytest", "-v", "--capture=tee-sys", "--tb=short", "--basetemp={env_tmp_dir}",
    {replace = "posargs", default = [], extend = true},
]]

[tool.tox.env.style]
description = "run all pre-commit hooks on all files"
dependency_groups = ["pre-commit"]
skip_install = true
commands = [["pre-commit", "run", "--all-files"]]

[tool.tox.env.typing]
description = "run static type checkers"
dependency_groups = ["typing"]
commands = [
    ["mypy"],
]

[tool.tox.env.docs]
description = "build docs"
dependency_groups = ["docs"]
commands = [["sphinx-build", "-E", "-W", "-b", "html", "docs", "docs/_build/"]]

[tool.tox.env.update-actions]
description = "update GitHub Actions pins"
labels = ["update"]
dependency_groups = ["gha-update"]
skip_install = true
commands = [["gha-update"]]

[tool.tox.env.update-pre_commit]
description = "update pre-commit pins"
labels = ["update"]
dependency_groups = ["pre-commit"]
skip_install = true
commands = [["pre-commit", "autoupdate", "--freeze", "-j4"]]

[tool.tox.env.update-requirements]
description = "update uv lock"
labels = ["update"]
dependency_groups = []
no_default_groups = true
skip_install = true
commands = [["uv", "lock", {replace = "posargs", default = ["-U"], extend = true}]]
