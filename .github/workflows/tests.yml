name: test

on:
  push:
    branches: [ master ]
    paths-ignore:
      - 'docs/**'
      - 'flaskbb/themes/**'
      - '**.md'
      - '**.rst'
      - '**/CHANGES'
      - '**/AUTHORS'
      - '**/LICENSE'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - 'docs/**'
      - 'flaskbb/themes/**'
      - '**.md'
      - '**.rst'
      - '**/CHANGES'
      - '**/AUTHORS'
      - '**/LICENSE'

env:
  FORCE_COLOR: '1'

jobs:
  style:
    name: pre-commit
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Install uv and set up Python
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        python-version: '3.14'

    - name: Cache pre-commit hooks
      uses: actions/cache@v4
      with:
        path: ~/.cache/pre-commit
        key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

    - name: Run pre-commit
      run: uv run --locked tox run -e style

  tests:
    name: ${{ matrix.tox }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {python: '3.14', tox: 'py3.14'}
          - {python: '3.13', tox: 'py3.13'}
          - {python: '3.12', tox: 'py3.12'}

    steps:
    - uses: actions/checkout@v6

    - name: Install uv and set up Python
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        python-version: ${{ matrix.python }}

    - name: Test with tox
      run: uv run --locked tox run -e ${{ matrix.tox }}
