{% extends theme("layout.html") %}

{% block content %}
{%- from theme('_macros/navigation.html') import sidebar with context -%}

{% block breadcrumb %}
{% endblock %}

<div class="card management">
    <div class="d-flex management-body">
        <div class="nav-sidebar management-sidebar">
            {{ sidebar(get_management_navigation(current_user, active)) }}
        </div>
        <div class="management-content flex-fill" id="management-content">
            <div class="row g-0">
            {% block management_content %}{% endblock %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
