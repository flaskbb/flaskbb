services:
  flaskbb:
    image: ${FLASKBB_PLUGIN_IMAGE:-flaskbb:plugins}
    build:
      context: .
      dockerfile: Dockerfile.plugin
      args:
        FLASKBB_IMAGE: ${FLASKBB_IMAGE:-ghcr.io/flaskbb/flaskbb:latest}
        FLASKBB_PLUGINS: ${FLASKBB_PLUGINS:?set FLASKBB_PLUGINS in docker/.env}

  celery:
    image: ${FLASKBB_PLUGIN_IMAGE:-flaskbb:plugins}
